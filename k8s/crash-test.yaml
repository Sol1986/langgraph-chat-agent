metadata:
  name: crash-test
  namespace: cloudino-devops

spec:
  containers:
    - name: crash-test
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Application starting...'; echo 'Fatal error!'; exit 1"]

  restartPolicy: Always


